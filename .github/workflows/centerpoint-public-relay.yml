name: Collect public CenterPoint Texas reports
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/centerpoint-public-relay.mjs'
      - 'lib/centerpoint-public-validation.mjs'
      - '.github/workflows/centerpoint-public-relay.yml'
  schedule:
    - cron: '6,16,26,36,46,56 * * * *'
permissions:
  contents: write
concurrency:
  group: utility-relay-publications
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect and validate official Texas map
        run: node scripts/centerpoint-public-relay.mjs
      - name: Save valid publication
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/centerpoint-tx.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update public CenterPoint Texas publication'
            git pull --rebase
            git push
          fi
