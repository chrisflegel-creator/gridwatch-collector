name: Collect public CenterPoint Texas reports
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/centerpoint-public-relay.mjs'
      - 'lib/centerpoint-public-validation.mjs'
      - '.github/workflows/centerpoint-public-relay.yml'
  schedule:
    # Request twice as often to give delayed scheduled runs more freshness headroom.
    # GitHub scheduling is best-effort; Gridwatch still validates source timestamps.
    - cron: '3-58/5 * * * *'
permissions:
  contents: write
concurrency:
  group: centerpoint-public-relay
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect and validate official Texas map
        run: node scripts/centerpoint-public-relay.mjs
      - name: Save valid publication
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/centerpoint-tx.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update public CenterPoint Texas publication'
            published=0
            for attempt in 1 2 3; do
              git pull --rebase
              if git push; then published=1; break; fi
            done
            test "$published" = 1
          fi
