name: Inspect public CA TX OH maps
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/ca-tx-oh-inspect.yml']
permissions:
  contents: write
concurrency:
  group: utility-relay-publications
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Read public map documents
        run: |
          node --input-type=module <<'JS'
          import {mkdir,writeFile} from 'node:fs/promises';
          const urls=['https://tracker.centerpointenergy.com/map/app.78ab3b90334415369860.centerpoint-map-1.5.2.bundle.js','https://outagemap.epelectric.com/'];
          const reports=await Promise.all(urls.map(async url=>{try{const r=await fetch(url,{signal:AbortSignal.timeout(25000)}),body=await r.text();return {url,status:r.status,length:body.length,body:url.endsWith('.js')?undefined:body,urls:[...new Set(body.match(/https?:[^"'<>\\s]+/g)??[])].filter(x=>!x.includes('www.w3.org')).slice(-100),contexts:[...body.matchAll(/.{0,100}(?:api\\/|county|lastUpdated|customersOut|config\\.json|serviceArea|ServiceArea|dataEndpoint|outageEndpoint|datacapable|DataCapable|regionConfig).{0,220}/gi)].map(x=>x[0]).slice(-150)};}catch(e){return {url,error:e.message};}}));
          await mkdir('public',{recursive:true});await writeFile('public/ca-tx-oh-inspect.json',JSON.stringify({collectedAt:new Date().toISOString(),reports}));console.log(reports.map(x=>({url:x.url,status:x.status,length:x.length})));
          JS
      - name: Save public inspection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/ca-tx-oh-inspect.json
          git diff --cached --quiet || git commit -m 'Inspect public CA TX OH utility maps'
          git pull --rebase
          git push
