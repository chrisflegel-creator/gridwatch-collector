name: Inspect public CA TX OH maps
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/ca-tx-oh-inspect.yml']
permissions:
  contents: write
concurrency:
  group: utility-relay-publications
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Read public map documents
        run: |
          node --input-type=module <<'JS'
          import {mkdir,writeFile} from 'node:fs/promises';
          const root='https://centerpoint.datacapable.com/datacapable/v2',base=root+'/p/centerpoint/r/texas/map/';
          const urls=[base+'app/settings',base+'stats',root+'/cache/p/centerpoint/r/texas/map/events',base+'events/count?types=COUNTY','https://riversideca.gov/outages/v3/index.html'];
          const reports=await Promise.all(urls.map(async url=>{try{const r=await fetch(url,{signal:AbortSignal.timeout(25000)});return {url,status:r.status,body:await r.text()};}catch(e){return {url,error:e.message};}}));
          await mkdir('public',{recursive:true});await writeFile('public/ca-tx-oh-inspect.json',JSON.stringify({collectedAt:new Date().toISOString(),reports}));console.log(reports.map(x=>({url:x.url,status:x.status,size:x.body?.length})));
          JS
      - name: Save public inspection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/ca-tx-oh-inspect.json
          git diff --cached --quiet || git commit -m 'Inspect public CA TX OH utility maps'
          git pull --rebase
          git push
