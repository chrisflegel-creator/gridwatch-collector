name: Inspect public CA TX OH maps
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/ca-tx-oh-inspect.yml']
permissions:
  contents: write
concurrency:
  group: utility-relay-publications
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Read public map documents
        run: |
          node --input-type=module <<'JS'
          import {mkdir,writeFile} from 'node:fs/promises';
          const urls=['https://tracker.centerpointenergy.com/map/?lv=true','https://www.epelectric.com/outage-center'];
          const reports=await Promise.all(urls.map(async url=>{try{const r=await fetch(url,{signal:AbortSignal.timeout(25000)}),body=await r.text();const assets=[];if(r.ok){for(const m of body.matchAll(/<script[^>]+src=["']([^"']+)["']/g)){const u=new URL(m[1],r.url);if(u.origin!==new URL(r.url).origin)continue;try{const a=await fetch(u,{signal:AbortSignal.timeout(15000)});assets.push({url:u.href,status:a.status,body:(await a.text()).slice(0,700000)});}catch{}}}return {url,status:r.status,body:body.slice(0,250000),assets};}catch(e){return {url,error:e.message};}}));
          await mkdir('public',{recursive:true});await writeFile('public/ca-tx-oh-inspect.json',JSON.stringify({collectedAt:new Date().toISOString(),reports}));console.log(reports.map(x=>({url:x.url,status:x.status,error:x.error,assets:x.assets?.map(a=>({url:a.url,status:a.status,size:a.body.length}))})));
          JS
      - name: Save public inspection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/ca-tx-oh-inspect.json
          git diff --cached --quiet || git commit -m 'Inspect public CA TX OH utility maps'
          git pull --rebase
          git push
