name: Inspect public CA TX OH maps
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/ca-tx-oh-inspect.yml']
permissions:
  contents: write
concurrency:
  group: utility-relay-publications
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Read public map documents
        run: |
          node --input-type=module <<'JS'
          import {mkdir,writeFile} from 'node:fs/promises';
          const url='https://tracker.centerpointenergy.com/map/app.78ab3b90334415369860.centerpoint-map-1.5.2.bundle.js';
          const r=await fetch(url,{signal:AbortSignal.timeout(25000)}),body=await r.text(),contexts=[];let pos=0;while((pos=body.indexOf('fetch(',pos))>=0){contexts.push(body.slice(Math.max(0,pos-350),pos+750));pos+=6;}const reports=[{url,status:r.status,contexts}];
          await mkdir('public',{recursive:true});await writeFile('public/ca-tx-oh-inspect.json',JSON.stringify({collectedAt:new Date().toISOString(),reports}));console.log({status:r.status,contexts:contexts.length});
          JS
      - name: Save public inspection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/ca-tx-oh-inspect.json
          git diff --cached --quiet || git commit -m 'Inspect public CA TX OH utility maps'
          git pull --rebase
          git push
