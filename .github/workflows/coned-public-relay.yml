name: Collect public Con Edison reports
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: write
concurrency:
  group: coned-public-relay
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect public reports
        run: node scripts/coned-public-relay.mjs
      - name: Save updated publication
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/coned.json
          if git diff --cached --quiet; then
            echo 'Publication unchanged'
          else
            git commit -m 'Update public Con Edison publication'
            git push
          fi
