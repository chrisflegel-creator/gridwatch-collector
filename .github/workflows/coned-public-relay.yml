name: Collect public Con Edison reports
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/coned-public-relay.mjs'
      - '.github/workflows/coned-public-relay.yml'
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
permissions:
  contents: write
concurrency:
  group: coned-public-relay
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect public reports
        run: node scripts/coned-public-relay.mjs
      - name: Save updated publication
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/coned.json
          if git diff --cached --quiet; then
            echo 'Publication unchanged'
          else
            git commit -m 'Update public Con Edison publication'
            published=0
            for attempt in 1 2 3; do
              git pull --rebase
              if git push; then published=1; break; fi
            done
            test "$published" = 1
          fi
